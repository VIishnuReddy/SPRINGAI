spring.application.name=openAI
server.port=8081

spring.ai.openai.apikey = ${OPEN_API_KEY}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:chatdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Create the database schema from Spring AI's JDBC initializer
spring.ai.chat.memory.repository.jdbc.initialize-schema=always


spring.docker.compose.stop.command=down

# qdrant connection
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=instructor

spring.ai.mcp.client.enabled=true

spring.ai.mcp.client.streamable-http.connections.mentor-ticket.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.mentor-ticket.endpoint=/mcp

management.endpoints.web.exposure.include=health,metrics,prometheus
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0